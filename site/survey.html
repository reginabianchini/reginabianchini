        <main>
            <div>
                <h1>Survey</h1>
                <form action="https://formspree.io/f/xdkwgrwo" method="POST">
                    <label for="name_field">What is your name?</label>
                    <input type="text" id="name_field" name="name_field" required>
                    <br><br>
                    <label for="email_field">What is your email?</label>
                    <input type="email" id="email_field" name="email" required>
                    <br><br>
                    <label for="best_whole_number">Which whole number is best?</label>
                    <input type="number" step="1" id="best_whole_number" name="best_whole_number" min="0" max="5000"
                        required>
                    <br><br>
                    <label for="best_day">Which day is best</label>
                    <input type="date" id="best_day" name="best_day" required>
                    <br><br>
                    <label for="best_bear">Which bear is best?</label>
                    <select name="best_bear" id="best_bear">
                        <option value="">&nbsp;</option>
                        <option value="Black" id="Black">Black</option>
                        <option value="Brown" id="Brown">Brown</option>
                        <option value="Care" id="Care">Care</option>
                        <option value="Panda" id="Panda">Panda</option>
                        <option value="Polar" id="Polar">Polar</option>
                        <option value="Teddy" id="Teddy">Teddy</option>
                    </select>
                    <br><br>
                    <fieldset>
                        <legend>Do you like radio buttons?</legend>
                        <ul>

                            <li> <label><input type="radio" name="enjoys_radio_buttons" value="Yes">
                                    Yes</label></li>
                            <li> <label><input type="radio" name="enjoys_radio_buttons" value="No">
                                    No</label> </li>
                            <li> <label><input type="radio" name="enjoys_radio_buttons" value="?" checked>
                                    None of your business</label></li>
                        </ul>
                    </fieldset>
                    <br><br>
                    <label for="life_meaning">What is the meaning of life?</label>
                    <textarea id="life_meaning" rows="5" cols="50">
                    Enter the correct answer here
                  </textarea>
                    <button type="submit" value="Send">Submit</button>
                </form>
            </div>
        </main>
